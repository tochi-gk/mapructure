<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>色分け日本地図</title>

  <!-- CSV解析用ライブラリ PapaParse -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <style>
    html, body { background: transparent; }
    body { font-family: sans-serif; text-align: center; }

    #map svg { width: 80%; max-width: 700px; height: auto; }

    .prefecture {
      fill: #e0e0e0;
      stroke: #ffffff;
      stroke-width: 1.5;
      transition: fill 0.5s ease;
      cursor: pointer;
    }
    .prefecture:hover { opacity: 0.8; }
    .prefecture.selected { stroke: #000000; stroke-width: 3; }

    #status { margin: 15px; font-weight: bold; color: #555; }
    button { margin: 4px; padding: 8px 14px; font-size: 14px; cursor: pointer; }

    #controls {
      margin: 10px auto; padding: 10px 14px; max-width: 550px;
      border: 1px solid #ccc; border-radius: 8px; text-align: left; font-size: 15px;
    }
    #controls .row { margin: 6px 0; display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
    #controls label { white-space: nowrap; cursor: pointer; }
    #controls label.wrap { white-space: normal; }
    #column { font-size: 15px; }
    #range-hint { font-size: 13px; color: #555; white-space: pre-line; margin-top: 4px; }

    #points { margin: 8px 0 4px 1.4em; }
    #points input { width: 7em; font-size: 15px; }
    #points input:disabled { background: #eee; color: #555; }
    #points .calc { font-size: 13px; color: #555; }
    #pts-warn { font-size: 13px; color: #d33; min-height: 1em; }

    #palette-note { margin-top: 10px; font-size: 13px; color: #555; }
    #palette .row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
    #palette .name { width: 7.5em; flex-shrink: 0; }
    #palette input.hex { width: 9em; font-family: monospace; font-size: 15px; }
    #palette input.invalid { border: 2px solid #d33; }

    #legend-bar { height: 14px; margin-top: 8px; border: 1px solid #999; border-radius: 3px; }
    #legend-text { margin-top: 4px; font-size: 13px; color: #555; }

    #info {
      margin: 10px auto; padding: 10px 14px; max-width: 460px;
      border: 1px solid #ccc; border-radius: 8px; font-size: 15px; line-height: 1.7;
    }
    .swatch {
      display: inline-block; width: 1.3em; height: 1.3em;
      vertical-align: middle; border: 1px solid #999;
    }
  </style>
</head>
<body>

  <h1>色分け日本地図</h1>
  <div id="status">データを読み込み中...</div>

  <!-- コントロールパネル -->
  <div id="controls">
    <div class="row">
      <strong>モード:</strong>　
      <label><input type="radio" name="mode" value="1"> 1色</label>
      <label><input type="radio" name="mode" value="2" checked> 2色</label>
      <label><input type="radio" name="mode" value="3"> 3色</label>
      <label><input type="radio" name="mode" value="4"> 4色以上</label>
    </div>

    <!-- モード3のサブオプション -->
    <div class="row" id="mode3-sub" style="display:none">
      <strong>3色モード種類:</strong>
      <label><input type="radio" name="submode3" value="rgb"> 3列合成(RGB)</label>
      <label><input type="radio" name="submode3" value="freq" checked> 最頻値(上位3件)</label>
    </div>

    <!-- 共通: 列選択 (3列RGBの場合は隠す) -->
    <div class="row" id="col-select-row">
      <label><strong>使う列</strong> <select id="column"></select></label>
    </div>
    
    <!-- モード4以上のオプション -->
    <div class="row" id="mode4-options" style="display:none">
      <label><strong>抽出する色数(上位N件):</strong> <input type="number" id="freq-n" value="4" min="4" max="20" style="width:4em"></label>
    </div>

    <!-- モード1(1色)用の設定 -->
    <div id="mode1-options" style="display:none; padding-top: 10px; border-top: 1px dashed #ccc;">
      <div class="row">
        <label class="wrap"><input type="checkbox" id="common"> 全列の最大・最小値をそろえる</label>
      </div>
      <div class="row" style="font-size:13px; font-weight:bold;">基準にする2点（残りの1点は対称に決まります）</div>
      <div class="row"><label class="wrap"><input type="radio" name="pair" value="max-ref" checked> 最大と基準 → 最小を計算</label></div>
      <div class="row"><label class="wrap"><input type="radio" name="pair" value="ref-min"> 基準と最小 → 最大を計算</label></div>
      <div class="row"><label class="wrap"><input type="radio" name="pair" value="max-min"> 最大と最小 → 基準を計算</label></div>

      <div id="points">
        <div class="row"><label>最大値 <input type="number" id="pt-max" step="any"></label> <span class="calc" id="calc-max"></span></div>
        <div class="row"><label>基準値 <input type="number" id="pt-ref" step="any"></label> <span class="calc" id="calc-ref"></span></div>
        <div class="row"><label>最小値 <input type="number" id="pt-min" step="any"></label> <span class="calc" id="calc-min"></span></div>
      </div>
      <div id="pts-warn"></div>
      <button id="btn-fill-data" style="font-size:12px;">データから入力し直す</button>
    </div>

    <!-- モード2(2色)用の設定 -->
    <div id="mode2-options" style="display:none; padding-top: 10px; border-top: 1px dashed #ccc;">
      <div class="row">
        <label><strong>分岐の基準値:</strong> <input type="number" id="m2-ref" step="any"></label>
        <span style="font-size: 13px; color: #555;">(基準以上と未満で色を分けます)</span>
      </div>
    </div>

    <div id="range-hint"></div>
    <div id="palette-note"></div>
    <div id="palette"></div>
    <button id="btn-reset-colors" style="margin-top: 10px; font-size:12px;">色を初期値に戻す</button>

    <div id="legend-bar" style="display:none"></div>
    <div id="legend-text" style="display:none"></div>
  </div>

  <div>
    <button id="btn-png">PNG保存（背景透明）</button>
    <button id="btn-svg">SVG保存</button>
  </div>

  <div id="info">地図の都道府県をタップすると詳細が表示されます</div>
  <div id="map"></div>

  <script>
    // CSV URL
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRYN1iWNq5SJGieYHh0kVkXT71bOVZHn6phlxWABHEdwIuvLLn2l8T7zrIMbr7h6Hm3ovZDAON-x0_A/pub?gid=0&single=true&output=csv';

    const NODATA = '#e0e0e0';
    const DEFAULT_PALETTE = {
      '1': { low: '#ffffff', ref: '#ff0000', high: '#200000' },
      '2': { above: '#00ff00', below: '#ff0000' }, // 規準以上は緑、未満は赤
      // 最頻値で利用するパレット (最大20色用意)
      'freq': ['#e6194b', '#3cb44b', '#ffe119', '#4363d8', '#f58231', '#911eb4', '#46f0f0', '#f032e6', '#bcf60c', '#fabebe', '#008080', '#e6beff', '#9a6324', '#fffac8', '#800000', '#aaffc3', '#808000', '#ffd8b1', '#000075', '#808080']
    };

    const state = {
      rows: [], fields: [], byCode: {},
      mode: '2', column: '', submode3: 'freq', freqN: 4,
      pts: { max: 0, ref: 0, min: 0 },
      pair: 'max-ref', common: false, m2Ref: 0,
      palette: JSON.parse(JSON.stringify(DEFAULT_PALETTE))
    };
    const infoByCode = {}; 

    // 色ユーティリティ
    const clamp01 = t => Math.min(1, Math.max(0, t));
    const rgbStr = c => `rgb(${c.join(', ')})`;
    const toHex = c => '#' + c.map(v => v.toString(16).padStart(2, '0')).join('');
    const hexToRgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
    const round2 = x => Math.round(x * 100) / 100;

    function normalizeHex(str) {
      let h = String(str).trim().replace(/^#/, '');
      if (/^[0-9a-fA-F]{3}$/.test(h)) h = h.split('').map(ch => ch + ch).join('');
      return /^[0-9a-fA-F]{6}$/.test(h) ? '#' + h.toLowerCase() : null;
    }

    function lerp(c1, c2, t) {
      t = clamp01(t);
      return c1.map((v, i) => Math.round(v + (c2[i] - v) * t));
    }
    function between(v, a, b, ca, cb) {
      return lerp(ca, cb, b === a ? 1 : (v - a) / (b - a));
    }
    function gradientAt(v, anchors) {
      if (v <= anchors[0].pos) return anchors[0].color;
      for (let i = 0; i < anchors.length - 1; i++) {
        const a = anchors[i], b = anchors[i + 1];
        if (v <= b.pos) return between(v, a.pos, b.pos, a.color, b.color);
      }
      return anchors[anchors.length - 1].color;
    }

    // 統計・演算
    const DERIVED = { 'max-ref': 'min', 'ref-min': 'max', 'max-min': 'ref' };
    function resolvePoints() {
      const { max, ref, min } = state.pts;
      if (state.pair === 'max-ref') return { max, ref, min: ref - (max - ref) };
      if (state.pair === 'ref-min') return { max: ref + (ref - min), ref, min };
      return { max, ref: (max + min) / 2, min };
    }

    function statsOf(values) {
      const v = values.filter(x => !isNaN(x)).sort((a, b) => a - b);
      if (!v.length) return null;
      const mid = Math.floor(v.length / 2);
      const median = v.length % 2 ? v[mid] : (v[mid - 1] + v[mid]) / 2;
      return { min: v[0], max: v[v.length - 1], median };
    }
    function columnStats(col) { return statsOf(state.rows.map(r => parseFloat(r[col]))); }
    function allStats() {
      const cols = state.fields.filter(f => f !== 'pref_id');
      return statsOf(state.rows.flatMap(r => cols.map(c => parseFloat(r[c]))));
    }

    // 最頻値(データ抽出)
    function getFreqData(col) {
      const counts = {};
      state.rows.forEach(r => {
        let v = r[col];
        if (v !== undefined && v !== null) {
          v = String(v).trim();
          if (v !== '') counts[v] = (counts[v] || 0) + 1;
        }
      });
      // 出現回数の降順でソート
      return Object.entries(counts).sort((a, b) => b[1] - a[1]);
    }

    // グラデーションのスケール取得
    function getScale() {
      const own = columnStats(state.column);
      if (!own) return null;
      const stats = state.common ? (allStats() || own) : own;
      const pts = resolvePoints();
      const pal = state.palette['1'];
      const defs = [['low', pts.min], ['ref', pts.ref], ['high', pts.max]];
      const anchors = defs
        .filter(([key]) => pal[key] !== '')
        .map(([key, pos]) => ({ pos, color: hexToRgb(pal[key]) }))
        .sort((a, b) => a.pos - b.pos);

      if (anchors.length < 2) return { error: '色を2つ以上指定してください' };
      return { stats, pts, anchors, colorAt: v => gradientAt(v, anchors) };
    }

    // 描画関連
    function paint(el, color) {
      el.style.fill = color;
      el.querySelectorAll('path').forEach(p => { p.style.fill = color; });
    }

    function render() {
      if (!state.rows.length) return;
      const statusEl = document.getElementById('status');

      Object.keys(infoByCode).forEach(k => delete infoByCode[k]);
      Object.values(state.byCode).forEach(el => paint(el, NODATA));

      let painted = 0;
      const setColor = (code, rgb, label) => {
        const el = state.byCode[code];
        if (!el || !rgb) return;
        paint(el, rgbStr(rgb));
        infoByCode[code] = { rgb, label };
        painted++;
      };

      const m = state.mode;
      const isFreq = (m === '3' && state.submode3 === 'freq') || m === '4';

      if (m === '1') {
        const col = state.column;
        const sc = getScale();
        if (!sc || sc.error) {
          statusEl.textContent = sc ? sc.error : `列「${col}」に数値がありません`;
          updateLegend(); return;
        }
        state.rows.forEach(row => {
          const v = parseFloat(row[col]);
          if (!isNaN(v)) setColor(parseInt(row.pref_id, 10), sc.colorAt(v), `${col} ${row[col]}`);
        });

      } else if (m === '2') {
        const col = state.column;
        const ref = parseFloat(document.getElementById('m2-ref').value);
        if (isNaN(ref)) {
          statusEl.textContent = '基準値を入力してください';
          return;
        }
        const rgbAbove = hexToRgb(state.palette['2'].above);
        const rgbBelow = hexToRgb(state.palette['2'].below);

        state.rows.forEach(row => {
          const v = parseFloat(row[col]);
          if (!isNaN(v)) setColor(parseInt(row.pref_id, 10), v >= ref ? rgbAbove : rgbBelow, `${col} ${row[col]}`);
        });

      } else if (m === '3' && state.submode3 === 'rgb') {
        const keys = ['green', 'blue', 'red'];
        if (keys.some(k => !state.fields.includes(k))) {
          statusEl.textContent = `3色合成には列が必要です: green, blue, red`;
          return;
        }
        const values = state.rows.flatMap(r => keys.map(k => parseFloat(r[k]))).filter(v => !isNaN(v));
        const max = Math.max(...values);
        const norm = v => parseFloat(v) / max;

        state.rows.forEach(row => {
          const rG = norm(row.green), rB = norm(row.blue), rR = norm(row.red);
          if ([rG, rB, rR].some(isNaN)) return;
          const rgb = [255 * (1-rG) * (1-rB), 255 * (1-rB) * (1-rR), 255 * (1-rG) * (1-rR)].map(Math.round);
          setColor(parseInt(row.pref_id, 10), rgb, `green ${row.green} / blue ${row.blue} / red ${row.red}`);
        });

      } else if (isFreq) {
        const col = state.column;
        const freqData = getFreqData(col);
        const N = m === '3' ? 3 : state.freqN;
        const topN = freqData.slice(0, N);
        const colorMap = {};
        
        topN.forEach((item, i) => {
          const hex = state.palette.freq[i];
          if (hex) colorMap[item[0]] = hexToRgb(hex);
        });

        state.rows.forEach(row => {
          const v = String(row[col]).trim();
          if (v && colorMap[v]) setColor(parseInt(row.pref_id, 10), colorMap[v], `${col}: ${v}`);
        });
      }

      statusEl.textContent = painted ? `同期完了：${painted}県を着色しました` : '色を計算できませんでした。';
      updateLegend();
    }

    function updateLegend() {
      const bar = document.getElementById('legend-bar');
      const text = document.getElementById('legend-text');
      bar.style.display = text.style.display = 'none';

      if (state.mode === '1') {
        const sc = getScale();
        if (!sc || sc.error || sc.stats.max === sc.stats.min) return;
        const { min, max } = sc.stats;
        const pos = v => Math.round((v - min) / (max - min) * 1000) / 10;
        const breaks = sc.anchors.map(a => a.pos).filter(p => p > min && p < max);
        const points = [min, ...breaks, max];
        bar.style.background = 'linear-gradient(to right, ' + points.map(v => `${rgbStr(sc.colorAt(v))} ${pos(v)}%`).join(', ') + ')';
        text.textContent = `左端＝最小 ${min} ／ 右端＝最大 ${max}`;
        bar.style.display = text.style.display = 'block';
      }
    }

    function buildPaletteInputs() {
      const box = document.getElementById('palette');
      const note = document.getElementById('palette-note');
      box.innerHTML = ''; note.textContent = '';
      const m = state.mode;
      const isFreq = (m === '3' && state.submode3 === 'freq') || m === '4';

      if (m === '3' && state.submode3 === 'rgb') return; // RGBはパレットなし

      let config = []; // [key, label, valueHolder, labelWidth]
      if (m === '1') {
        note.textContent = '色はカラーコード（例：#ff0000）で変更できます。空欄にした色は使わず間を補間します。';
        config = [['high', '最大値', state.palette['1'], '6em'], ['ref', '基準値', state.palette['1'], '6em'], ['low', '最小値', state.palette['1'], '6em']];
      } else if (m === '2') {
        note.textContent = '基準値以上と未満の2色を指定します。';
        config = [['above', '基準値以上', state.palette['2'], '8em'], ['below', '基準値未満', state.palette['2'], '8em']];
      } else if (isFreq) {
        note.textContent = '指定した列でよく出現するデータ（最頻値）上位に色を割り当てます。';
        const freqData = getFreqData(state.column);
        const N = m === '3' ? 3 : state.freqN;
        for (let i = 0; i < N; i++) {
          const label = freqData[i] ? `${i+1}位: ${freqData[i][0]} (${freqData[i][1]}件)` : `${i+1}位: (データなし)`;
          config.push([i, label, state.palette.freq, '14em']);
        }
      }

      config.forEach(([key, label, holder, width]) => {
        const row = document.createElement('div');
        row.className = 'row';
        const name = document.createElement('span');
        name.className = 'name'; name.textContent = label; name.style.width = width;
        const swatch = document.createElement('span');
        swatch.className = 'swatch'; swatch.style.background = holder[key] || 'transparent';
        const input = document.createElement('input');
        input.type = 'text'; input.className = 'hex'; input.maxLength = 7;
        input.placeholder = m === '1' ? '空欄＝使わない' : 'カラーコード';
        input.value = holder[key] || '';

        input.addEventListener('input', () => {
          const raw = input.value.trim();
          if (raw === '' && m === '1') {
            input.classList.remove('invalid');
            holder[key] = ''; swatch.style.background = 'transparent';
            render(); return;
          }
          const hex = normalizeHex(raw);
          input.classList.toggle('invalid', !hex);
          if (!hex) return;
          holder[key] = hex; swatch.style.background = hex;
          render();
        });
        row.append(name, swatch, input);
        box.append(row);
      });
    }

    // 入力同期・UI同期
    function syncPointInputs() {
      const eff = resolvePoints();
      const derived = DERIVED[state.pair];
      ['max', 'ref', 'min'].forEach(k => {
        const input = document.getElementById('pt-' + k);
        const isDerived = k === derived;
        input.disabled = isDerived;
        if (isDerived) input.value = round2(eff[k]);
        else if (document.activeElement !== input) input.value = state.pts[k];
        document.getElementById('calc-' + k).textContent = isDerived ? '← 計算値' : '';
      });
      const warn = document.getElementById('pts-warn');
      warn.textContent = (eff.max > eff.ref && eff.ref > eff.min) ? '' : '最大値 ＞ 基準値 ＞ 最小値 になるように指定してください';
    }

    function updateRangeHint() {
      const own = columnStats(state.column);
      const all = allStats();
      const m = state.mode;
      const tId = document.getElementById('range-hint');
      if (m === '3' && state.submode3 === 'rgb') { tId.textContent = ''; return; }
      
      let t = own ? `選択列の 最小 ${own.min} ／ 最大 ${own.max} ／ 中央値 ${own.median}` : '';
      if (state.common && all) t += `\n全列の 最小 ${all.min} ／ 最大 ${all.max}`;
      tId.textContent = t;
    }

    function fillFromData(keepRef) {
      const own = columnStats(state.column);
      if (!own) return;
      const stats = state.common ? (allStats() || own) : own;
      state.pts.max = stats.max;
      state.pts.min = stats.min;
      if (!keepRef) {
        state.pts.ref = round2(own.median);
        document.getElementById('m2-ref').value = round2(own.median);
      }
      updateRangeHint();
      syncPointInputs();
    }

    function syncUI() {
      const m = state.mode;
      document.getElementById('mode3-sub').style.display = m === '3' ? 'flex' : 'none';
      document.getElementById('mode4-options').style.display = m === '4' ? 'flex' : 'none';
      document.getElementById('mode1-options').style.display = m === '1' ? 'block' : 'none';
      document.getElementById('mode2-options').style.display = m === '2' ? 'block' : 'none';

      const isRgb = m === '3' && state.submode3 === 'rgb';
      document.getElementById('col-select-row').style.display = isRgb ? 'none' : 'flex';

      buildPaletteInputs();
      updateRangeHint();
    }

    // イベントリスナー
    document.querySelectorAll('input[name="mode"]').forEach(r => r.addEventListener('change', e => {
      state.mode = e.target.value;
      syncUI(); render();
    }));
    document.querySelectorAll('input[name="submode3"]').forEach(r => r.addEventListener('change', e => {
      state.submode3 = e.target.value;
      syncUI(); render();
    }));
    document.querySelectorAll('input[name="pair"]').forEach(r => r.addEventListener('change', e => {
      state.pair = e.target.value;
      syncPointInputs(); render();
    }));
    document.getElementById('freq-n').addEventListener('input', e => {
      let v = parseInt(e.target.value, 10);
      if (isNaN(v) || v < 2) v = 4;
      state.freqN = v;
      buildPaletteInputs(); render();
    });

    document.getElementById('column').addEventListener('change', e => {
      state.column = e.target.value;
      fillFromData(state.common);
      if ((state.mode === '3' && state.submode3 === 'freq') || state.mode === '4') buildPaletteInputs();
      render();
    });
    document.getElementById('common').addEventListener('change', e => {
      state.common = e.target.checked;
      fillFromData(true); render();
    });

    ['max', 'ref', 'min'].forEach(k => document.getElementById('pt-' + k).addEventListener('input', e => {
      const v = parseFloat(e.target.value);
      if (!isNaN(v)) { state.pts[k] = v; syncPointInputs(); render(); }
    }));
    document.getElementById('m2-ref').addEventListener('input', () => render());

    document.getElementById('btn-fill-data').addEventListener('click', () => { fillFromData(false); render(); });
    document.getElementById('btn-reset-colors').addEventListener('click', () => {
      state.palette = JSON.parse(JSON.stringify(DEFAULT_PALETTE));
      buildPaletteInputs(); render();
    });

    // 読み込みフロー
    async function updateMapFromSheet() {
      const statusEl = document.getElementById('status');
      try {
        const svgText = await (await fetch('./map-full.svg')).text();
        document.getElementById('map').innerHTML = svgText;
        state.byCode = {};
        document.querySelectorAll('.prefecture').forEach(p => state.byCode[parseInt(p.dataset.code, 10)] = p);

        const csvText = await (await fetch(CSV_URL)).text();
        const results = Papa.parse(csvText, { header: true, skipEmptyLines: true, transformHeader: h => h.trim().toLowerCase() });
        state.rows = results.data;
        state.fields = results.meta.fields || [];

        if (!state.fields.includes('pref_id')) {
          statusEl.textContent = `列 pref_id が見つかりません`; return;
        }

        const candidates = state.fields.filter(f => f !== 'pref_id');
        const sel = document.getElementById('column');
        sel.innerHTML = '';
        candidates.forEach(f => sel.append(new Option(f, f)));
        state.column = candidates[0] || '';

        fillFromData(false);
        syncUI();
        render();
      } catch (error) {
        console.error(error); statusEl.textContent = '読み込みに失敗しました';
      }
    }

    // 保存・タップ処理 (オリジナルと同様)
    function buildStandaloneSvg() {
      const svg = document.querySelector('#map svg');
      if (!svg) return null;
      const clone = svg.cloneNode(true);
      clone.querySelectorAll('.prefecture').forEach(g => {
        g.style.stroke = '#ffffff'; g.style.strokeWidth = '1.5';
        if (!g.style.fill) g.style.fill = NODATA;
      });
      clone.querySelectorAll('a').forEach(a => a.removeAttributeNS('http://www.w3.org/1999/xlink', 'href'));
      const vb = svg.viewBox.baseVal;
      const ratio = vb && vb.width ? vb.height / vb.width : 1;
      const width = 2000;
      clone.setAttribute('width', width); clone.setAttribute('height', Math.round(width * ratio));
      clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
      return { xml: new XMLSerializer().serializeToString(clone), width, height: Math.round(width * ratio) };
    }
    function saveFile(blob, filename) {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = filename; a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }
    document.getElementById('btn-svg').addEventListener('click', () => {
      const s = buildStandaloneSvg();
      if (s) saveFile(new Blob([s.xml], { type: 'image/svg+xml;charset=utf-8' }), 'color-map.svg');
    });
    document.getElementById('btn-png').addEventListener('click', () => {
      const s = buildStandaloneSvg();
      if (!s) return;
      const url = URL.createObjectURL(new Blob([s.xml], { type: 'image/svg+xml;charset=utf-8' }));
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = s.width; canvas.height = s.height;
        canvas.getContext('2d').drawImage(img, 0, 0, s.width, s.height);
        URL.revokeObjectURL(url);
        canvas.toBlob(blob => saveFile(blob, 'color-map.png'), 'image/png');
      };
      img.src = url;
    });

    document.getElementById('map').addEventListener('click', e => {
      const pref = e.target.closest('.prefecture');
      if (!pref) return;
      const code = parseInt(pref.dataset.code, 10);
      const title = pref.querySelector('title');
      const name = title ? title.textContent.split('/')[0].trim() : `コード ${code}`;
      const d = infoByCode[code];
      const info = document.getElementById('info');

      document.querySelectorAll('.prefecture.selected').forEach(x => x.classList.remove('selected'));
      pref.classList.add('selected');
      pref.parentNode.appendChild(pref);

      info.textContent = '';
      if (!d || !d.rgb) { info.append(`${name}：データなし`); return; }

      const swatch = document.createElement('span');
      swatch.className = 'swatch'; swatch.style.background = rgbStr(d.rgb);
      info.append(swatch, `${name}　RGB(${d.rgb.join(', ')})　${toHex(d.rgb)}`);
      info.append(document.createElement('br'), d.label);
    });

    window.addEventListener('DOMContentLoaded', updateMapFromSheet);
  </script>
